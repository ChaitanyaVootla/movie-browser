# Analytics Stack: ClickHouse
#
# Deploy alongside existing services on EC2:
#   docker-compose -f analytics/docker-compose.analytics.yml up -d
#
# Access:
#   - ClickHouse HTTP: http://localhost:8123
#   - ClickHouse Native: localhost:9000
#
# Note: Grafana removed Jan 2026 - SQL queries now available via /admin dashboard

services:
  # ===========================================================================
  # ClickHouse - Analytics Database
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: analytics-clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native interface
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config:/etc/clickhouse-server/config.d:ro
    environment:
      - CLICKHOUSE_DB=analytics
      - CLICKHOUSE_USER=analytics
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-analytics_secret_123}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  clickhouse-data:
  clickhouse-logs:

networks:
  default:
    name: analytics-network
