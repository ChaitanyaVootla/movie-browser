# Grafana ClickHouse Datasource Provisioning
# Auto-configured on Grafana startup

apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    isDefault: true
    editable: false
    jsonData:
      defaultDatabase: analytics
      port: 9000
      server: clickhouse
      username: analytics
      tlsSkipVerify: true
      dialTimeout: 10
      queryTimeout: 60
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
