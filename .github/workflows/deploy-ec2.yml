name: Build and Deploy Next.js to EC2

on:
  push:
    branches: [next]
  workflow_dispatch: # Manual trigger

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # CI: Typecheck + Lint
  # ===========================================================================
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

  # ===========================================================================
  # Build + Deploy
  # ===========================================================================
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: beta

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Next.js
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GOOGLE_AUTH_CLIENT_ID: ${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
          GOOGLE_AUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}
        run: yarn build

      - name: Create deployment package
        run: |
          tar -czf deploy.tar.gz \
            .next \
            public \
            package.json \
            yarn.lock \
            .yarnrc.yml \
            next.config.mjs \
            docker-compose.yml \
            Caddyfile \
            ecosystem.config.cjs \
            prisma \
            postgres/init \
            analytics/clickhouse \
            scripts

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NEXT_EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.NEXT_EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem \
            deploy.tar.gz \
            ubuntu@${{ secrets.NEXT_EC2_HOST }}:/home/ubuntu/movie-browser-next/

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.NEXT_EC2_HOST }} << 'EOF'
            set -e
            cd /home/ubuntu/movie-browser-next

            echo "[1/6] Extracting build..."
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            echo "[2/6] Starting PostgreSQL + ClickHouse + Caddy..."
            docker compose up -d --wait
            docker compose ps

            echo "[3/6] Installing production dependencies..."
            corepack enable
            yarn install --immutable

            echo "[4/6] Applying Prisma schema..."
            npx prisma db push --skip-generate 2>&1 || echo "Schema already up to date"

            echo "[5/6] Creating data directories..."
            mkdir -p data/enriched logs
            mkdir -p .cache/{youtube-channels,youtube,person,search,discover,movie,series,images}

            echo "[6/6] Restarting PM2..."
            pm2 stop all 2>/dev/null || true
            pm2 delete all 2>/dev/null || true
            pm2 start ecosystem.config.cjs
            pm2 save

            echo ""
            echo "Deployment complete!"
            pm2 list
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          curl -sf --max-time 15 http://${{ secrets.NEXT_EC2_HOST }}:3002/ > /dev/null \
            && echo "Health check passed" \
            || echo "Warning: Health check failed (app may still be starting)"
