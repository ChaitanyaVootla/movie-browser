name: Build and Deploy Next.js to EC2

on:
  push:
    branches: [next]
  workflow_dispatch: # Manual trigger

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # CI: Typecheck + Lint
  # ===========================================================================
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

  # ===========================================================================
  # Build + Deploy
  # ===========================================================================
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: beta

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Next.js
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GOOGLE_AUTH_CLIENT_ID: ${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
          GOOGLE_AUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}
          # Dummy values for build-time module evaluation (not used at runtime)
          MONGO_IP: build-placeholder
          MONGO_PASS: build-placeholder
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          # Real key when the TMDB_API_KEY secret exists — '/' and '/topics' are
          # prerendered AT BUILD TIME, and a placeholder key bakes EMPTY trending
          # sections into the deployed HTML (the post-deploy revalidation step
          # below is the backstop that re-renders them on the box).
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'build-placeholder' }}
          # PG-only mode at build time: prevents auth.ts module evaluation from
          # constructing a MongoDB client against the placeholder host, and keeps
          # builds working after MONGO_* vars are removed post-GA. Runtime mode
          # is controlled by .env.local on the box, not by this.
          USER_DATA_SOURCE: postgres
          ENABLE_MONGODB_ENRICHMENT: "false"
        run: yarn build

      - name: Create deployment package
        run: |
          # Ship the GHA-built node_modules IN the tar so the box does NO
          # `yarn install` (that ~1.2GB install + npx prisma spiked ~4GB next
          # to the live server and froze the 2-core box, Jun 11). The runner
          # already ran `yarn install --immutable` above, so node_modules here
          # is the exact production tree. Keeps `next start` + .env loading +
          # cacheHandler unchanged (lower risk than a standalone restructure).
          tar -czf deploy.tar.gz \
            .next \
            node_modules \
            public \
            package.json \
            yarn.lock \
            .yarnrc.yml \
            next.config.mjs \
            cache-handler.cjs \
            docker-compose.yml \
            Caddyfile \
            ecosystem.config.cjs \
            prisma \
            postgres/init \
            postgres/migrations \
            analytics/clickhouse \
            scripts

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NEXT_EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.NEXT_EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Preflight - require free disk on EC2
        run: |
          # Jun 10 2026: a full disk (unbounded ISR cache) made scp/tar fail
          # partway and left the box half-deployed. Fail loudly BEFORE
          # uploading, and emergency-prune the bounded cache dir if needed.
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.NEXT_EC2_HOST }} << 'EOF'
            set -e
            FREE_MB=$(df --output=avail -m / | tail -1 | tr -d ' ')
            echo "Free disk: ${FREE_MB}MB"
            if [ "$FREE_MB" -lt 3000 ]; then
              echo "Low disk — running emergency ISR + image cache prune..."
              cd /home/ubuntu/movie-browser-next
              FORCE_RUN=1 ISR_CACHE_BUDGET_MB=1000 IMAGE_CACHE_BUDGET_MB=1000 node scripts/prune-isr-cache.js || true
              rm -rf .next/cache/bounded-isr || true
              FREE_MB=$(df --output=avail -m / | tail -1 | tr -d ' ')
              echo "Free disk after prune: ${FREE_MB}MB"
            fi
            if [ "$FREE_MB" -lt 2000 ]; then
              echo "::error::Less than 2GB free on EC2 — refusing to deploy onto a full disk"
              exit 1
            fi
            # Memory preflight (Jun 11: yarn install on a leak-bloated box
            # OOM/swap-froze the KERNEL — instance needed an AWS reboot).
            # A bloated next is restarted first: free relief, and the deploy
            # restarts it anyway.
            MEM_MB=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
            NEXT_RSS=$(ps aux | grep "next-server" | grep -v grep | head -1 | awk '{print int($6/1024)}')
            echo "Available memory: ${MEM_MB}MB; next RSS: ${NEXT_RSS:-0}MB"
            # Restart a bloated next BEFORE the install lands — Jun 11 second
            # freeze: preflight passed at ~2GB available but the deploy's own
            # footprint on top of a 2GB next froze the kernel anyway.
            if [ "$MEM_MB" -lt 2500 ] || [ "${NEXT_RSS:-0}" -gt 1000 ]; then
              echo "Restarting next to reclaim RSS before deploying..."
              pm2 restart next || true
              sleep 10
              MEM_MB=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
              echo "Available memory after restart: ${MEM_MB}MB"
            fi
            if [ "$MEM_MB" -lt 1500 ]; then
              echo "::error::Less than 1.5GB memory available — deploying now risks freezing the box"
              exit 1
            fi
          EOF

      - name: Upload to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem \
            deploy.tar.gz \
            ubuntu@${{ secrets.NEXT_EC2_HOST }}:/home/ubuntu/movie-browser-next/

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.NEXT_EC2_HOST }} << 'EOF'
            set -e
            cd /home/ubuntu/movie-browser-next

            echo "[1/5] Extracting build (incl. prebuilt node_modules)..."
            # Overlay extract — yarn --immutable means node_modules is the exact
            # same version tree, so overwriting in place is idempotent and safe
            # under the still-running old process (no rm of a live node_modules).
            # .next/cache (ISR, bounded) is not in the tar, so it's preserved.
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            echo "[2/6] Starting PostgreSQL + ClickHouse + Caddy..."
            # Start all services but only BLOCK on Postgres readiness — the app
            # depends on Postgres, not ClickHouse. ClickHouse (best-effort
            # analytics) being slow/unhealthy must never fail the deploy, which
            # `docker compose up --wait` previously did.
            docker compose up -d
            # NOTE: deliberately NO `--force-recreate clickhouse`. Restarting
            # ClickHouse every deploy makes it re-merge its part backlog, spiking
            # CPU for minutes and slowing search/SSR right after each deploy. It
            # already has its config; config.d edits are rare and can be applied
            # with a one-off `docker compose up -d --force-recreate clickhouse`.
            echo "Waiting for PostgreSQL to accept connections..."
            # NOTE: `</dev/null` is REQUIRED — `docker compose exec` reads stdin,
            # and without it the exec swallows the rest of this heredoc script
            # (it previously ate steps 3-6, so PM2 never restarted).
            for i in $(seq 1 45); do
              if docker compose exec -T postgres pg_isready -U moviebrowser -d moviebrowser </dev/null >/dev/null 2>&1; then
                echo "PostgreSQL ready"; break
              fi
              sleep 2
            done
            docker compose ps </dev/null

            # NOTE: no `yarn install` step — node_modules ships in the tar
            # (built on the GHA runner). The on-box install was the Jun 11
            # kernel-freeze trigger; eliminating it is the whole point.

            # [2.5/5] Prisma schema + FTS — GATED to only run when the schema /
            # index SQL actually CHANGED. These steps (bundled prisma db push +
            # FTS psql) ran on EVERY deploy and their memory cost, concurrent
            # with the cold-restarting next, was a Jun 11 freeze contributor.
            # Gate by file hash stored on the box: most deploys skip both
            # entirely (schema rarely changes). prisma generate already ran in
            # the build; the runtime @prisma/client is in the shipped tree.
            echo "[2.5/5] Prisma schema (gated)..."
            set -a; source .env; set +a

            # [2.5a] watched_movies → watch_events: EXPAND/CONTRACT pre-push snapshot.
            # The social schema drops the watched_movies table (data moves to
            # watch_events). `prisma db push` only syncs the `public` schema, so a
            # copy in a SEPARATE schema survives the push (verified Jun 19 2026 on a
            # restored prod-shaped DB). Snapshot it BEFORE db push, then db push may
            # safely drop public.watched_movies (we hold the data), then backfill
            # post-push. Self-gating: only fires while the legacy table still exists
            # (i.e. the first social deploy); inert forever after. HARD-FAILS if the
            # snapshot can't be taken — never let db push drop unbacked-up data.
            ACCEPT_DL=""
            WM_EXISTS=$(docker compose exec -T postgres psql -U moviebrowser -d moviebrowser -tAc \
              "SELECT to_regclass('public.watched_movies') IS NOT NULL" </dev/null 2>/dev/null | tr -d '[:space:]')
            if [ "$WM_EXISTS" = "t" ]; then
              echo "[2.5a] legacy watched_movies present -> snapshot to migration_backup before db push"
              docker compose exec -T postgres psql -U moviebrowser -d moviebrowser -v ON_ERROR_STOP=1 </dev/null \
                -c "CREATE SCHEMA IF NOT EXISTS migration_backup; DROP TABLE IF EXISTS migration_backup.watched_movies; CREATE TABLE migration_backup.watched_movies AS SELECT * FROM public.watched_movies;" 2>&1 | tail -3 \
                && ACCEPT_DL="--accept-data-loss" \
                || { echo "::error::watched_movies snapshot FAILED — aborting before db push to avoid data loss"; exit 1; }
              echo "[2.5a] snapshot OK; db push will run with --accept-data-loss (data is backed up)"
            fi

            SCHEMA_HASH=$(md5sum prisma/schema.prisma | cut -d' ' -f1)
            if [ "$SCHEMA_HASH" != "$(cat .last-schema-hash 2>/dev/null)" ]; then
              echo "schema changed -> db push"
              # $ACCEPT_DL is set ONLY on the watched_movies migration deploy (above);
              # empty on every normal deploy, so destructive changes still refuse.
              NODE_OPTIONS="--max-old-space-size=512" nice -n 19 \
                ./node_modules/.bin/prisma db push --skip-generate $ACCEPT_DL 2>&1 \
                && echo "$SCHEMA_HASH" > .last-schema-hash \
                || echo "db push warning (non-fatal)"
            else
              echo "schema unchanged -> skip db push"
            fi

            # [2.5b] watched_movies → watch_events: post-push backfill. NOT
            # hash-gated — self-gates on the migration_backup snapshot existing
            # (no-op on every normal deploy). Idempotent + verifies completeness;
            # HARD-FAILS on error (migration_backup retains the data → re-deploy
            # retries). See postgres/migrations/2026-06-19-watched-movies-to-watch-events.sql.
            echo "[2.5b] watched_movies -> watch_events backfill (gated on snapshot)..."
            # NB: capture psql's REAL exit code — piping to `tail` would mask it
            # (pipeline status = tail's 0), which on Jun 19 2026 let a FAILED
            # migration (db push had aborted, so watch_events didn't exist → this
            # script RAISEd) report a falsely-successful deploy. Write to a file,
            # then check $?.
            docker compose exec -T postgres psql -U moviebrowser -d moviebrowser -v ON_ERROR_STOP=1 \
              < postgres/migrations/2026-06-19-watched-movies-to-watch-events.sql > /tmp/backfill.log 2>&1
            BACKFILL_RC=$?
            tail -6 /tmp/backfill.log
            if [ "$BACKFILL_RC" -ne 0 ]; then
              echo "::error::watched_movies backfill FAILED (rc=$BACKFILL_RC) — migration_backup retains the data; fix + re-run the deploy"
              exit 1
            fi

            echo "[3/5] FTS indexes (gated)..."
            FTS_HASH=$(md5sum postgres/init/02-search-indexes.sql | cut -d' ' -f1)
            if [ "$FTS_HASH" != "$(cat .last-fts-hash 2>/dev/null)" ]; then
              echo "FTS sql changed -> apply"
              docker compose exec -T postgres \
                psql -U moviebrowser -d moviebrowser -v ON_ERROR_STOP=0 \
                < postgres/init/02-search-indexes.sql 2>&1 | tail -8 \
                && echo "$FTS_HASH" > .last-fts-hash \
                || echo "FTS index step warning (non-fatal)"
            else
              echo "FTS sql unchanged -> skip"
            fi

            echo "[3.5/5] UGC constraints (gated)..."
            # Gate on schema + constraints file COMBINED: `prisma db push` table
            # recreation silently drops CHECK constraints, so a schema change
            # must re-fire this even when 04-ugc-constraints.sql is unchanged
            # (social roadmap spec §4.1 invariant 5). File is idempotent
            # (DROP CONSTRAINT IF EXISTS + ADD / CREATE UNIQUE INDEX IF NOT EXISTS).
            UGC_HASH=$(cat postgres/init/04-ugc-constraints.sql prisma/schema.prisma | md5sum | cut -d' ' -f1)
            if [ "$UGC_HASH" != "$(cat .last-ugc-hash 2>/dev/null)" ]; then
              echo "UGC sql or schema changed -> apply"
              docker compose exec -T postgres \
                psql -U moviebrowser -d moviebrowser -v ON_ERROR_STOP=0 \
                < postgres/init/04-ugc-constraints.sql 2>&1 | tail -8 \
                && echo "$UGC_HASH" > .last-ugc-hash \
                || echo "UGC constraints step warning (non-fatal)"
            else
              echo "UGC sql unchanged -> skip"
            fi

            echo "[3.6/5] Audit triggers (gated)..."
            # Gate on schema + audit file COMBINED: a `prisma db push` table
            # recreation silently drops TRIGGERS, so a schema change must
            # re-fire this even when 05-audit.sql is unchanged. File is
            # idempotent (CREATE OR REPLACE FUNCTION + DROP TRIGGER IF EXISTS +
            # CREATE TRIGGER). See .claude/rules/audit-log.md.
            AUDIT_HASH=$(cat postgres/init/05-audit.sql prisma/schema.prisma | md5sum | cut -d' ' -f1)
            if [ "$AUDIT_HASH" != "$(cat .last-audit-hash 2>/dev/null)" ]; then
              echo "audit sql or schema changed -> apply"
              docker compose exec -T postgres \
                psql -U moviebrowser -d moviebrowser -v ON_ERROR_STOP=0 \
                < postgres/init/05-audit.sql 2>&1 | tail -8 \
                && echo "$AUDIT_HASH" > .last-audit-hash \
                || echo "audit triggers step warning (non-fatal)"
            else
              echo "audit sql unchanged -> skip"
            fi

            echo "[4/5] Creating data directories..."
            mkdir -p data/enriched logs
            mkdir -p .cache/{youtube-channels,youtube,person,search,discover,movie,series,images}

            echo "[5/5] Restarting PM2..."
            # startOrReload keeps app definitions registered and restarts in
            # place — a much shorter 502 window than the old stop-all/delete-all
            # /start (which also lost the process list if start failed mid-way,
            # as in the Jun 10 disk-full deploy). Caveat: apps REMOVED from
            # ecosystem.config.cjs must be pm2-deleted manually once.
            pm2 startOrReload ecosystem.config.cjs
            pm2 save

            # PM2-independent disk-pressure failsafe. The isr-cache-prune job
            # lives INSIDE PM2 — when a full disk killed the PM2 daemon (Jun 19
            # 2026), nothing reclaimed disk and the box stayed down. This system
            # crontab runs disk-guard.sh every 15 min regardless of PM2 health.
            # Idempotent: strip any prior entry, re-add (the script ships in the
            # tar; chmod in case the tar lost the bit).
            chmod +x scripts/disk-guard.sh || true
            ( crontab -l 2>/dev/null | grep -v 'disk-guard.sh' ; \
              echo '*/15 * * * * /home/ubuntu/movie-browser-next/scripts/disk-guard.sh' ) \
              | crontab -
            echo "disk-guard cron installed"

            echo ""
            echo "[7/7] Revalidating build-prerendered pages (/ and /topics)..."
            # Build-time prerenders use placeholder env; re-render with box env.
            sleep 8
            RSECRET=$(grep -E "^AUTH_SECRET=" .env.local | head -1 | cut -d= -f2- | tr -d '"')
            curl -fsS --max-time 60 -X POST -H "x-revalidate-secret: $RSECRET" \
              http://localhost:3002/api/revalidate </dev/null \
              && echo "Revalidation OK" || echo "Warning: revalidation failed"

            # NO CloudFront `/*` invalidation on deploy. It cold-purges the ENTIRE
            # edge exactly when the origin is cold-restarting → removes the
            # stale-if-error safety net (nothing cached to serve) AND turns every
            # request into an edge-miss against the cold origin → re-fill stampede
            # → origin OOM + a real apex outage (Jun 11, learned the hard way).
            # Build-skew is handled WITHOUT a purge: deploymentId (next.config)
            # makes clients reload on action/RSC mismatch, and edge HTML
            # naturally revalidates within s-maxage (1h). The transient ≤1h skew
            # (occasional "Server Action not found" that self-heals via reload) is
            # FAR preferable to a cold-edge stampede. If a specific page must be
            # fresh now, invalidate THAT path only — never `/*` during a deploy.

            echo ""
            echo "Deployment complete!"
            pm2 list
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          curl -sf --max-time 15 http://${{ secrets.NEXT_EC2_HOST }}:3002/ > /dev/null \
            && echo "Health check passed" \
            || echo "Warning: Health check failed (app may still be starting)"
